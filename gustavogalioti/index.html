<title>Gustavo Galioti da Silva Prado · C2LZ Capital Partners</title>
<meta name="description" content="Líder da Mesa de Investimentos · C2LZ Capital Partners">

<style>
  :root{
    --bg:#050b1a;
    --surface:#0e1830;
    --surface-2:#0b1426;
    --teal:#3ac8be;
    --blue:#2b6ceb;
    --white:#f5f7fa;
    --muted:#8fa0bc;
    --line:#1c2942;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Manrope', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  /* faint dot-grid, matching brand pattern */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:26px 26px;
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    padding:36px 22px 48px;
  }

  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  header img{width:46px;height:46px;object-fit:contain;}
  header .lockup{display:flex;flex-direction:column;line-height:1.15;}
  header .lockup b{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:0.04em;
  }
  header .lockup span{
    font-family:'Sora',sans-serif;
    font-size:11px;
    letter-spacing:0.22em;
    color:var(--teal);
    font-weight:600;
  }

  .avatar-ring{
    width:200px;height:200px;
    margin:0 auto 26px;
    border-radius:50%;
    padding:6px;
    background:conic-gradient(from 0deg, var(--blue), var(--teal), var(--blue));
  }
  .avatar-inner{
    width:100%;height:100%;
    border-radius:50%;
    background:var(--bg);
    padding:5px;
  }
  .avatar-inner img{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }

  .identity{text-align:center;margin-bottom:8px;}
  .identity h1{
    font-family:'Sora',sans-serif;
    font-size:24px;
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .identity .role{
    font-family:'Sora',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.14em;
    color:var(--teal);
    text-transform:uppercase;
  }

  .tagline{
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    margin:14px 0 32px;
    font-style:italic;
  }
  .tagline em{color:var(--white);font-style:normal;}

  nav.links{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:34px;
  }
  nav.links a{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    border:1px solid var(--teal);
    border-radius:14px;
    background:var(--surface);
    color:var(--white);
    text-decoration:none;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  nav.links a:hover{background:var(--surface-2); transform:translateY(-1px);}
  nav.links a .chev{color:var(--teal); font-weight:700; font-size:18px;}
  nav.links a.disabled{
    opacity:0.55;
    border-color:var(--line);
  }
  nav.links a.disabled .chev{color:var(--muted);}

  .contact{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    line-height:1.9;
    padding-top:24px;
    border-top:1px solid var(--line);
  }
  .contact b{color:var(--white); font-weight:600;}

  footer{
    text-align:center;
    color:#5c6c88;
    font-size:11px;
    letter-spacing:0.05em;
    margin-top:30px;
  }
</style>
</head>
